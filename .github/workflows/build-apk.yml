name: Build GESTFARM Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android repository
        uses: actions/checkout@v4

      - name: Checkout GESTFARM web application
        uses: actions/checkout@v4
        with:
          repository: valeryyacinthe-gif/Gestfarm
          ref: main
          path: web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build GESTFARM web application
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm install
          npm run build

      - name: Copy web application into Capacitor assets
        run: |
          rm -rf dist
          cp -R web/dist ./dist

      - name: Install Android wrapper dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Install the exact GESTFARM launcher icon
        run: |
          test -f assets/gestfarm-icon.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("assets/gestfarm-icon.png").convert("RGBA")
          if source.width != source.height:
              raise SystemExit("L'icone GESTFARM doit etre une image carree.")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          res = Path("android/app/src/main/res")
          for folder, size in sizes.items():
              target = res / folder
              target.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(target / "ic_launcher.png", optimize=True)
              icon.save(target / "ic_launcher_round.png", optimize=True)

          # Remove Capacitor's generic adaptive launcher icons so Android
          # uses the supplied official GESTFARM PNG resources instead.
          adaptive = res / "mipmap-anydpi-v26"
          if adaptive.exists():
              import shutil
              shutil.rmtree(adaptive)
          PY

      # Keep the Android debug signing key stable between builds so APK updates
      # can be installed over the previous GESTFARM version.
      - name: Restore persistent Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gestfarm-android-debug-signing-v1

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload GESTFARM APK
        uses: actions/upload-artifact@v4
        with:
          name: GESTFARM-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
